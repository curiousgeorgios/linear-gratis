name: Docker image

# Builds the self-hosting image on every relevant pull request (no push) and
# publishes multi-arch images to Docker Hub and GHCR for main and release tags.
#
# Required repository secrets for publishing to Docker Hub:
#   DOCKERHUB_USERNAME   Docker Hub account or organisation that owns the image
#   DOCKERHUB_TOKEN      Docker Hub access token with read/write scope
# Optional repository variable:
#   DOCKERHUB_REPOSITORY image name, defaults to "linear-gratis"

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway .env and validate docker-compose.yml
        run: |
          node docker/generate-env.mjs --out .env --url http://localhost:3000
          docker compose config --quiet

  image:
    name: Build and push
    runs-on: ubuntu-latest
    needs: compose
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'linear-gratis' }}
      CAN_PUSH_DOCKERHUB: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      CAN_PUSH_GHCR: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.CAN_PUSH_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.CAN_PUSH_GHCR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          images=""
          if [ "$CAN_PUSH_DOCKERHUB" = "true" ]; then
            images="${{ secrets.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPOSITORY}"
          fi
          if [ "$CAN_PUSH_GHCR" = "true" ]; then
            ghcr="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${DOCKERHUB_REPOSITORY}"
            images="${images:+$images$'\n'}$ghcr"
          fi
          # Pull requests only verify that the image builds.
          images="${images:-linear-gratis}"
          { echo 'list<<EOF'; echo "$images"; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
